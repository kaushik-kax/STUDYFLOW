<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyFlow Sign Up</title>

    <link rel="icon" href="icon-192.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0f17;
            font-family: Arial, sans-serif;
            color: white;
        }

        .signup-container {
            width: 90%;
            max-width: 400px;
            padding: 35px;
            background: #111722;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            text-align: center;
        }

        .logo {
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitle {
            color: #8f9bb3;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #b8c1d4;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            outline: none;
            background: #0b0f17;
            color: white;
            font-size: 15px;
        }

        input:focus {
            border-color: #7183ff;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #7183ff;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #6174f0;
        }

        .switch {
            margin-top: 20px;
            color: #8f9bb3;
            font-size: 14px;
        }

        .switch span {
            color: #8c9aff;
            cursor: pointer;
        }

        .message {
            margin-top: 15px;
            font-size: 13px;
            color: #8f9bb3;
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="logo">✦</div>

        <h1>Create Account</h1>

        <div class="subtitle">
            Join StudyFlow
        </div>

        <div class="input-group">
            <label>Username</label>
            <input
                type="text"
                id="username"
                placeholder="Choose a username"
                autocomplete="username"
            >
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                autocomplete="new-password"
            >
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Enter password again"
                autocomplete="new-password"
            >
        </div>

        <button onclick="signup()">
            Create Account
        </button>

        <div class="switch">
            Already have an account?
            <span onclick="goToLogin()">Login</span>
        </div>

        <div class="message" id="message"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL =
            "https://xhtbeosrycbzwqpwfsos.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_vXqF2_g39FkuJWTGYX5U0Q_4c8zXTyp";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function signup() {

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message =
                document.getElementById("message");


            if (
                username === "" ||
                password === "" ||
                confirmPassword === ""
            ) {
                message.textContent =
                    "Please fill in all fields.";
                return;
            }


            if (username.length < 3) {
                message.textContent =
                    "Username must be at least 3 characters.";
                return;
            }


            if (password.length < 6) {
                message.textContent =
                    "Password must be at least 6 characters.";
                return;
            }


            if (password !== confirmPassword) {
                message.textContent =
                    "Passwords do not match.";
                return;
            }


            message.textContent =
                "Creating your account...";


            const internalEmail =
                username.toLowerCase() +
                "@studyflow.local";


            const { data, error } =
                await supabaseClient.auth.signUp({
                    email: internalEmail,
                    password: password,
                    options: {
                        data: {
                            username: username
                        }
                    }
                });


            if (error) {
                message.textContent =
                    error.message;
                return;
            }


            if (!data.user) {
                message.textContent =
                    "Account could not be created.";
                return;
            }


            const { error: profileError } =
                await supabaseClient
                    .from("profiles")
                    .insert({
                        id: data.user.id,
                        username: username
                    });


            if (profileError) {
                message.textContent =
                    profileError.message;
                return;
            }


            message.textContent =
                "Account created successfully!";


            setTimeout(function() {
                window.location.href =
                    "index.html";
            }, 1000);
        }


        function goToLogin() {
            window.location.href =
                "login.html";
        }
    </script>

</body>
</html>
