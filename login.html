<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyFlow - Login</title>

    <link rel="icon" href="logo.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #0b0f17;
            color: white;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        .login-card {
            background: #111722;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-logo img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            display: block;
            margin: 0 auto 12px;
        }

        .login-logo h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
        }

        .login-logo p {
            margin-top: 8px;
            color: #8994aa;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #c7cfdd;
        }

        .input-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            outline: none;
            background: #0b0f17;
            color: white;
            font-size: 15px;
        }

        .input-group input:focus {
            border-color: #7d8cff;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #6675f7;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-button:hover {
            background: #5969ed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #ff8d8d;
            min-height: 20px;
        }

        .signup-text {
            text-align: center;
            margin-top: 22px;
            color: #8994aa;
            font-size: 14px;
        }

        .signup-text a {
            color: #8d9aff;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                <div class="login-symbol">✦</div>

                <h1>StudyFlow</h1>

                <p>Sign in to continue your studies</p>
            </div>

            <div class="input-group">

                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                >

            </div>

            <div class="input-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

            </div>

            <button
                type="button"
                class="login-button"
                onclick="login()"
            >
                Login
            </button>

            <div id="message"></div>

            <div class="signup-text">

                Don't have an account?

                <a onclick="showSignup()">
                    Create one
                </a>

            </div>

        </div>

    </div>


    <script>

        const SUPABASE_URL =
            "https://xhtbeosrycbzwqpwfsos.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_vXqF2_g39FkuJWTGYX5U0Q_4c8zXTyp";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function login() {

            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const message =
                document.getElementById("message");


            message.textContent = "";


            if (username === "" || password === "") {

                message.textContent =
                    "Please enter username and password.";

                return;
            }


            const internalEmail =
                username.toLowerCase() +
                "@studyflow.local";


            const { data, error } =
                await supabaseClient.auth.signInWithPassword({

                    email: internalEmail,

                    password: password

                });


            if (error) {

                message.textContent =
                    "Invalid username or password.";

                console.log(error);

                return;
            }


            localStorage.setItem(
                "studyflowLoggedIn",
                "true"
            );


            window.location.replace(
                "index.html"
            );

        }


        function showSignup() {

            window.location.href =
                "signup.html";

        }


        document
            .getElementById("password")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {

                    login();

                }

            });

    </script>

</body>

</html>
