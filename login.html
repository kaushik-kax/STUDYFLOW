<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyFlow Login</title>

    <link rel="icon" href="icon-192.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0f17;
            font-family: Arial, sans-serif;
            color: white;
        }

        .login-container {
            width: 90%;
            max-width: 400px;
            padding: 35px;
            background: #111722;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            text-align: center;
        }

        .logo {
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitle {
            color: #8f9bb3;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #b8c1d4;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            outline: none;
            background: #0b0f17;
            color: white;
            font-size: 15px;
        }

        input:focus {
            border-color: #7183ff;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #7183ff;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #6174f0;
        }

        .switch {
            margin-top: 20px;
            color: #8f9bb3;
            font-size: 14px;
        }

        .switch span {
            color: #8c9aff;
            cursor: pointer;
        }

        .message {
            margin-top: 15px;
            font-size: 13px;
            color: #8f9bb3;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">✦</div>

        <h1>Welcome Back</h1>

        <div class="subtitle">
            Login to StudyFlow
        </div>

        <div class="input-group">
            <label>Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                autocomplete="username"
            >
        </div>

        <div class="input-group">
            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
            >
        </div>

        <button onclick="login()">
            Login
        </button>

        <div class="switch">
            Don't have an account?
            <span onclick="showSignup()">Create one</span>
        </div>

        <div class="message" id="message"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL =
            "https://xhtbeosrycbzwqpwfsos.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_vXqF2_g39FkuJWTGYX5U0Q_4c8zXTyp";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function login() {

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");


            if (username === "" || password === "") {

                message.textContent =
                    "Please enter your username and password.";

                return;
            }


            message.textContent =
                "Logging in...";


            const internalEmail =
                username.toLowerCase() +
                "@studyflow.local";


            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: internalEmail,
                    password: password
                });


            if (error) {

                message.textContent =
                    "Invalid username or password.";

                return;
            }


            message.textContent =
                "Login successful!";


            setTimeout(function() {

                window.location.href =
                    "index.html";

            }, 500);
        }


        function showSignup() {

            window.location.href =
                "signup.html";
        }

    </script>

</body>
</html>
